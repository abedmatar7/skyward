name: Build

# Configured for Xiaomi 12X (psyche) on a free GitHub Actions runner.
# Builds the Skyward recovery ramdisk, streams psyche's stock boot.img kernel
# from Xiaomi's official HyperOS OTA package via unpayload HTTP range requests,
# and merges them into a ready-to-boot image using `skyward-pack boot`.
on:
  push:
    branches: ["*"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      device:
        description: The codename of the device to build for (defaults to psyche)
        required: false
        default: "psyche"
      psyche_ota_url:
        description: Official Xiaomi 12X (psyche) full OTA zip URL to stream boot.img kernel from
        required: false
        default: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.15.0.TLDCNXM/miui_PSYCHE_OS1.0.15.0.TLDCNXM_15effa03fa_13.0.zip"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Check that the tag names the version built
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Hold the tag against the workspace's version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, and the workspace builds version $version"
            exit 1
          fi

  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Lint what runs on the phone
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked --workspace --all-targets -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Allow skyward-pack boot to stream kernel from remote OTA zip URL
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path("crates/skyward-pack/src/main.rs")
          src = p.read_text()
          old = """        Cmd::Boot { kernel, ramdisk, out } => {
                      let mut img = BootImage::read(&ramdisk)?;
                      img.kernel = BootImage::read(&kernel)?.kernel;
                      write(&out, &img, &img.to_bytes()?)
                  }"""
          new = """        Cmd::Boot { kernel, ramdisk, out } => {
                      let kernel_path = if kernel.to_string_lossy().starts_with("http://") || kernel.to_string_lossy().starts_with("https://") {
                          let url = kernel.to_string_lossy().to_string();
                          let work = tempfile::Builder::new().prefix(".boot").tempdir_in(".")?;
                          let payload = unpayload::Payload::open_url(&url).with_context(|| format!("open {url}"))?;
                          let options = unpayload::ExtractOptions { output_dir: work.path().to_path_buf(), partitions: vec!["boot".into()], ..Default::default() };
                          let taken = payload.extract(&options, &|_| {}).with_context(|| format!("take boot out of {url}"))?;
                          let image = taken.iter().find(|i| i.partition == "boot").with_context(|| format!("{url} holds no boot partition"))?;
                          let dst = PathBuf::from("stock/psyche-boot.img");
                          if let Some(parent) = dst.parent() { std::fs::create_dir_all(parent)?; }
                          std::fs::rename(&image.path, &dst)?;
                          dst
                      } else {
                          kernel
                      };
                      let mut img = BootImage::read(&ramdisk)?;
                      img.kernel = BootImage::read(&kernel_path)?.kernel;
                      write(&out, &img, &img.to_bytes()?)
                  }"""
          assert old in src, "Expected Cmd::Boot block not found in crates/skyward-pack/src/main.rs"
          p.write_text(src.replace(old, new, 1))
          PY
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  devices:
    name: List the devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          DEVICE: ${{ inputs.device || 'psyche' }}
        run: |
          if [ -n "$DEVICE" ]; then
            test -f "devices/$DEVICE.toml"
            echo "devices=$(jq -nc --arg device "$DEVICE" '[$device]')" >> "$GITHUB_OUTPUT"
          else
            echo "devices=$(basename -s .toml devices/*.toml | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  recovery:
    name: Recovery for ${{ matrix.device }}
    needs: [tools, devices]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      - name: Read the stock build the recovery is made on
        id: stock
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" >> "$GITHUB_OUTPUT"
      - name: Restore the stock recovery
        id: cache
        uses: actions/cache@v6
        with:
          path: stock/recovery.img
          key: stock-recovery-${{ steps.stock.outputs.recovery }}
      - name: Take the recovery partition out of the stock package
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" --out stock/recovery.img
      - name: Check the stock recovery
        env:
          RECOVERY: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY  stock/recovery.img" | sha256sum --check
      - name: Pack the Skyward recovery ramdisk and merge psyche kernel
        id: pack
        env:
          DEVICE: ${{ matrix.device }}
          STOCK: ${{ steps.stock.outputs.version }}
          PSYCHE_OTA_URL: ${{ inputs.psyche_ota_url || 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.15.0.TLDCNXM/miui_PSYCHE_OS1.0.15.0.TLDCNXM_15effa03fa_13.0.zip' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          name="skyward-$version-$DEVICE-$STOCK"
          mkdir out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init \
            --config "devices/$DEVICE.toml" --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --out "out/$name-ramdisk.img"
          if [ "$DEVICE" = "psyche" ]; then
            if [ -f "stock/psyche-boot.img" ]; then
              KERNEL_SRC="stock/psyche-boot.img"
            else
              KERNEL_SRC="$PSYCHE_OTA_URL"
            fi
            tools/skyward-pack boot --kernel "$KERNEL_SRC" --ramdisk "out/$name-ramdisk.img" --out "out/$name.img" || \
            tools/skyward-pack boot --kernel "https://bn.d.miui.com/OS1.0.15.0.TLDCNXM/miui_PSYCHE_OS1.0.15.0.TLDCNXM_15effa03fa_13.0.zip" --ramdisk "out/$name-ramdisk.img" --out "out/$name.img"
            rm -f "out/$name-ramdisk.img"
          else
            mv "out/$name-ramdisk.img" "out/$name.img"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [tag, check, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: skyward-*
          path: images
          merge-multiple: true
          skip-decompress: true
      - name: Sum the zips
        working-directory: images
        run: sha256sum -- *.zip > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zips=()
          for config in devices/*.toml; do
            device=$(basename "$config" .toml)
            model=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["device"]["model"])' "$config")
            zip=$(ls images/skyward-"$GITHUB_REF_NAME"-"$device"-*.zip)
            zips+=("$zip#$model ($device)")
          done
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${zips[@]}" images/SHA256SUMS
